[package]
name = "tuigr"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Browse and edit music tags in the terminal"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
crossterm = "0.29"
dirs = "6"
deunicode = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
libc = "0.2"
lofty = "0.25"
opaline = { version = "0.4.2", features = ["builtin-themes", "ratatui"] }
ratatui = "0.30"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
toml = "0.8"
unicode-width = "0.2"
url = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
